[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "commonwatt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0",
    "anthropic>=2.0",
    "hypothesis>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["commonwatt*", "mcp*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
py-modules = []
