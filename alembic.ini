# Alembic configuration for Commonwatt.
#
# The database URL is NOT set here. db/migrations/env.py reads it from
# DATABASE_URL through db.config.get_database_url(), so the same revisions run
# against SQLite (local, tests) and Postgres (deployed demo).

[alembic]
script_location = db/migrations

# Lets `alembic` import the project's `db` package when run from the repo root.
prepend_sys_path = .

# Filename template for new revisions: <rev>_<slug>.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
