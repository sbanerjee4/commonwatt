[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commonwatt"
version = "0.1.0"
description = "Commonwatt: dashboards, data model, MCP tools and agent loop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    # MCP tools + agent
    "fastmcp>=4.0",
    "anthropic>=2.0",
    "python-dotenv>=1.0",
    # BFF / API
    "fastapi>=0.110",
    "uvicorn[standard]",
    "httpx>=0.27",
    "pydantic>=2",
    # Database + auth
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg2-binary",
    "bcrypt",
    # Tests
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "agent*", "bff*", "app*", "db*", "sim*", "notify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
