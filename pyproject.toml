[project]
name = "commonwatt-sms"
version = "0.1.0"
description = "CommonWatt SMS notifications (Twilio + simulated provider)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["db", "notify", "app", "app.routes", "mcp", "mcp.commonwatt_mcp"]
